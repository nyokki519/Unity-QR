<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light" />
    <title>Unity｜参加者QR</title>
    <link rel="icon" href="/assets/unity-logo.webp" type="image/webp" />
    <link rel="stylesheet" href="./ticket.css" />
    <script src="./ticket.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <img class="seal unityLogo" src="/assets/unity-logo.webp" alt="Unity" width="64" height="64" /><span>UNITY<small>YOUR SHARED MOMENT</small></span>
      </header>
      <article id="content">
        <p class="eyebrow">EVENT TICKET</p>
        <h1 id="title">参加者QR</h1>
        <p id="details"></p>
        <h2 id="name"></h2>
        <p id="status" role="status" aria-live="polite">
          参加登録を確認しています。
        </p>
        <div class="qrArea" id="qrArea" hidden>
          <img id="qr" alt="このイベントの受付用QR" />
          <p>受付スタッフにこの画面をご提示ください。</p>
          <small id="expiry"></small>
        </div>
        <button id="retry" type="button">最新の状態を確認</button>
        <p class="note">
          このリンクはあなた専用です。転送・公開はしないでください。<br />画面を開くだけでは、チェックインは完了しません。
        </p>
      </article>
      <footer>ONE COMMUNITY. MANY SHARED MOMENTS.</footer>
    </main>
  </body>
</html>
