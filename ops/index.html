<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#183c32" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Unity QR — Community Operations</title>
    <link rel="icon" href="/assets/unity-logo.webp" type="image/webp" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="loading">
        <img class="seal unityLogo" src="/assets/unity-logo.webp" alt="Unity" width="64" height="64">
        <p>受付を準備しています。</p>
      </div>
    </div>
    <div
      id="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      hidden
    ></div>
    <dialog id="modal" aria-labelledby="modalTitle">
      <div id="modalContent"></div>
      <button id="closeModal" class="textButton" type="button">閉じる</button>
    </dialog>
  </body>
</html>
